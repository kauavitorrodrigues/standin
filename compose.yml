services:
  postgres:
    image: postgres:18-alpine
    container_name: standin_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # The API with the media server inside it. Behind the "app" profile so a
  # plain `docker compose up` (local development) starts only the database.
  # Start the whole deployment with `docker compose --profile app up -d`.
  app:
    profiles: ["app"]
    build:
      context: .
      target: app
      args:
        APP_COMMIT: ${APP_COMMIT:-}
        APP_COMMIT_TIME: ${APP_COMMIT_TIME:-}
    container_name: standin_app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SERVER_PORT: ${SERVER_PORT:-3001}
      SERVER_URL: ${SERVER_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      JWT_SECRET: ${JWT_SECRET}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      MEDIA_WORKERS: ${MEDIA_WORKERS:-1}
      MEDIA_LISTEN_IP: 0.0.0.0
      MEDIA_LISTEN_PORT: ${MEDIA_LISTEN_PORT:-44444}
      # The public address of the machine. Without it clients cannot reach the
      # media port.
      MEDIA_ANNOUNCED_ADDRESS: ${MEDIA_ANNOUNCED_ADDRESS:?set the public address of the machine}
      # The first admin and organization. The container creates them on start
      # only when both ADMIN_EMAIL and ADMIN_PASSWORD are set.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ORGANIZATION_NAME: ${ORGANIZATION_NAME:-}
      # The initial value of the global settings, read only while the instance
      # has none saved. Empty keeps everything open.
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-}
      ALLOW_ORGANIZATION_CREATION: ${ALLOW_ORGANIZATION_CREATION:-}
      ALLOW_SPACE_CREATION: ${ALLOW_SPACE_CREATION:-}
    ports:
      # One port for all media, over UDP first and TCP as the fallback.
      - "${MEDIA_LISTEN_PORT:-44444}:${MEDIA_LISTEN_PORT:-44444}/udp"
      - "${MEDIA_LISTEN_PORT:-44444}:${MEDIA_LISTEN_PORT:-44444}/tcp"
    volumes:
      - uploads:/app/apps/api/public
    # The image has no curl, so the check is a request made by node. /health
    # answers 200 only while the database answers. The start period covers the
    # migrations, which run before the server listens.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:${SERVER_PORT:-3001}/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Serves the web build and forwards /api to the app, with HTTPS from a
  # certificate Caddy gets by itself for SITE_ADDRESS.
  proxy:
    profiles: ["app"]
    build:
      context: .
      target: proxy
      args:
        APP_COMMIT: ${APP_COMMIT:-}
        APP_COMMIT_TIME: ${APP_COMMIT_TIME:-}
    container_name: standin_proxy
    # Waits for a healthy app so the first requests are not answered with a
    # bad gateway while the migrations run.
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      SERVER_PORT: ${SERVER_PORT:-3001}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    # Asks the admin endpoint Caddy keeps on localhost inside the container, so
    # the check does not depend on the domain or on the certificate.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # STUN/TURN relay for peers that cannot reach each other directly (strict
  # NAT, corporate firewall). Optional: it sits behind the "turn" profile, so
  # a plain `docker compose up` does not start it. Enable with
  # `docker compose --profile turn up -d coturn` after setting TURN_HOST and
  # TURN_SECRET in .env (the API reads the same two values to issue
  # short-lived credentials, see apps/api/src/features/ice).
  #
  # Host networking on purpose: the relay uses a range of UDP ports and
  # Docker's NAT layer gets in the way of it. The port range below must match
  # the ports opened in the firewall (host firewall and, on most VPS
  # providers, the separate provider-side firewall too).
  coturn:
    profiles: ["turn"]
    # Pinned by digest (coturn 4.18.0 at the time of pinning) so a pull can
    # never change the relay under you. To upgrade on purpose:
    # `docker pull coturn/coturn:latest`, then take the new digest from
    # `docker inspect coturn/coturn:latest --format '{{index .RepoDigests 0}}'`.
    image: coturn/coturn@sha256:bbefd3e1fdfdc0d58770fe01b581fd8b00d9f3a5580d00acb77cf719a6bc78e3
    container_name: standin_coturn
    network_mode: host
    restart: unless-stopped
    # TURN_SECRET never goes on the command line: with host networking every
    # user on the machine can read another process's arguments (`ps`), and
    # the secret signs every credential the API hands out. It is written to
    # a private config file inside the container (readable only by the
    # coturn user) and passed with -c, so only the file name is visible. The
    # container refuses to start without it, rather than running with an
    # empty secret. `$$` is how compose spells a literal `$`.
    entrypoint: ["/bin/sh", "-c"]
    environment:
      TURN_SECRET: ${TURN_SECRET:-}
    #
    # Flags, in the order below:
    #  - max-bps is bytes per second, not bits: 2,000,000 is about 16 Mbps
    #    per session, comfortably above the 4 Mbps the app sends for a screen.
    #  - denied-peer-ip: never relay into private or loopback ranges, or the
    #    TURN server becomes a bridge into the host's internal network. The
    #    last block covers carrier-grade NAT, IPv6 loopback, unique local and
    #    link-local, and IPv4-mapped IPv6 (which would otherwise sidestep the
    #    IPv4 rules).
    command:
      - |
        [ -n "$$TURN_SECRET" ] || { echo "TURN_SECRET is required" >&2; exit 1; }
        umask 077
        printf 'static-auth-secret=%s\n' "$$TURN_SECRET" > /tmp/turn-secret.conf
        exec turnserver -c /tmp/turn-secret.conf \
          --fingerprint \
          --use-auth-secret \
          --realm=${TURN_HOST:-} \
          --listening-port=${TURN_PORT:-3478} \
          --min-port=49160 \
          --max-port=49200 \
          --total-quota=100 \
          --max-bps=2000000 \
          --no-multicast-peers \
          --denied-peer-ip=0.0.0.0-0.255.255.255 \
          --denied-peer-ip=10.0.0.0-10.255.255.255 \
          --denied-peer-ip=127.0.0.0-127.255.255.255 \
          --denied-peer-ip=169.254.0.0-169.254.255.255 \
          --denied-peer-ip=172.16.0.0-172.31.255.255 \
          --denied-peer-ip=192.168.0.0-192.168.255.255 \
          --denied-peer-ip=100.64.0.0-100.127.255.255 \
          --denied-peer-ip=::1 \
          --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff \
          --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff \
          --denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255

volumes:
  postgres_data:
    driver: local
  uploads:
    driver: local
  caddy_data:
    driver: local